<!DOCTYPE html>
<!--
 temperatura.html

 Pagina web con los datos de la fecha, la hora, la temperatura en
 grados centigrados y Fahrenheit, humedad e indice de calor en
 grados centigrados y Fahrenheit. 
 La página se almacena en el sistema de archivos LittleFS en la
 memoria flash del microcontrolador ESP32 para ahorrar espacio
 en la memoria RAM

 Los elementos incrustados %FECHA%, %HUMEDAD%, %TEMP_CENT%,
 %TEMP_FAHR%, %IND_CAL_CENT% y %IND_CAL_FAHR% seran reemplazados
 por los valores de la fecha y hora, la humedad, la temperatura
 en grados centigrados, la temperatura en grados Fahrenheit,
 el indice de calor en grados centigrados y el indice de calor
 en grados Fahrenheit. La substitución lo hace la funcion
 processor()
-->
<html>

<head>
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
    <title>Clima Web Server As&iacute;ncrono</title>
    <link rel="stylesheet" type="text/css" href="estilos.css">
</head>

<body>
    <h1>Servidor Web del Clima</h1>
    <h2>Datos Climatol&oacute;gicos en Grados Cent&iacute;grados
        y Fahrenheith</h2>
    <form action="/a">
        <table>
            <tr>
                <th class="derecha">Fecha: </th>
                <td>%FECHA%</td>
            </tr>
        </table>
        <br />
        <table>
            <tr>
                <th class="derecha">Temperatura: </th>
                <td>%TEMP_CENT% &deg;C</td>
            </tr>
            <tr>
                <th>Temperatura: </th>
                <td>%TEMP_FAHR% &deg;F</td>
            </tr>
            <tr>
                <th class="derecha">Humedad: </th>
                <td>%HUMEDAD% &percnt;</td>
            </tr>
            <tr>
                <th class="derecha">&Iacute;ndice de calor:
                </th>
                <td>%IND_CAL_CENT% &deg;C</td>
            </tr>
            <tr>
                <th class="derecha">&Iacute;ndice de calor:
                </th>
                <td>%IND_CAL_FAHR% &deg;F</td>
            </tr>
        </table>
        <br />
        <p>
            <input type="submit" name="boton" value="Recargar">
        </p>
    </form>
</body>
</html>
